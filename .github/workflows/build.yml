name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release for this build"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Artifact Signing requires Windows.
    runs-on: windows-2025

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content src/Launcher/Launcher.csproj)
          $version = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "No <Version> found in src/Launcher/Launcher.csproj" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Build application
        run: dotnet publish src/Launcher/Launcher.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }}

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $out = "artifacts/ThoriumVoiceBridge-${{ steps.version.outputs.version }}.exe"
          Copy-Item src/Launcher/bin/Release/net10.0-windows/win-x64/publish/ThoriumVoiceBridge.exe $out
          Get-Item $out | Format-Table Name, Length

      - name: Read signing metadata
        id: signing
        shell: pwsh
        run: |
          $meta = Get-Content signing/metadata.json -Raw | ConvertFrom-Json
          "endpoint=$($meta.Endpoint)" >> $env:GITHUB_OUTPUT
          "account=$($meta.CodeSigningAccountName)" >> $env:GITHUB_OUTPUT
          "profile=$($meta.CertificateProfileName)" >> $env:GITHUB_OUTPUT

      # Pull requests from forks have no access to the OIDC federated credential,
      # so those builds produce an unsigned executable for smoke-testing only.
      - name: Decide whether to sign
        id: gate
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          $canSign = ('${{ github.event_name }}' -ne 'pull_request') -and -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)
          "sign=$($canSign.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Azure login
        if: steps.gate.outputs.sign == 'true'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign executable
        if: steps.gate.outputs.sign == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ steps.signing.outputs.endpoint }}
          signing-account-name: ${{ steps.signing.outputs.account }}
          certificate-profile-name: ${{ steps.signing.outputs.profile }}
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        if: steps.gate.outputs.sign == 'true'
        shell: pwsh
        run: |
          $file = "artifacts/ThoriumVoiceBridge-${{ steps.version.outputs.version }}.exe"
          $sig = Get-AuthenticodeSignature $file
          Write-Host "$file -> $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "The executable is not validly signed." }

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ThoriumVoiceBridge-${{ steps.version.outputs.version }}-exe
          path: artifacts/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ThoriumVoiceBridge-${{ needs.build.outputs.version }}-exe
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.exe
